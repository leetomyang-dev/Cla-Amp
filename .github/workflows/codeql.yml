# GitHub's own code scanner, looking for security faults in the JavaScript.
# Its findings show under the repository's Security tab.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '41 5 * * 3'

permissions:
  contents: read

jobs:
  analyze:
    name: Scan the code
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
